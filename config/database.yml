# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 8 } %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  timeout: 10000
  # Curtos de propósito. O router do Heroku desliga o pedido aos 30s, e o
  # DatabaseConnectionRetry ainda tenta 3 vezes: com 10s de connect_timeout o
  # total passava dos 30s e o aluno levava a página de timeout do Heroku, que
  # não é nossa e leva junto tudo que ele digitou. Errar em segundos e mostrar
  # a nossa página de erro é bem melhor que travar e sumir.
  connect_timeout: 3
  checkout_timeout: 5
  keepalives: 1
  keepalives_idle: 60
  keepalives_interval: 10
  keepalives_count: 3
  variables:
    statement_timeout: '90s'

development:
  <<: *default
  database: practice_fr_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: practice_fr_test

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
production:
  <<: *default
  database: practice_fr_production
  username: practice_fr
  password: <%= ENV["PRACTICE_FR_DATABASE_PASSWORD"] %>
